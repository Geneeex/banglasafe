[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "banglasafe"
version = "1.0.0"
description = "Bengali LLM safety benchmark: 879 statute-anchored prompts, 17 harm categories, 5 register conditions, calibrated four-way judge."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Naymul Islam", email = "naymul504@gmail.com" }]
keywords = ["bengali", "bangla", "safety", "benchmark", "llm", "red-teaming", "jailbreak", "evaluation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

# core is HTTP-only: no torch, no transformers, no inference engine
dependencies = [
  "typer>=0.15",
  "openai>=1.60",
  "numpy>=1.24",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.1", "ruff>=0.6"]

[project.urls]
Homepage = "https://banglallm.github.io/banglasafe/"
Paper = "https://arxiv.org/abs/2608.22335"
Leaderboard = "https://banglallm.github.io/banglasafe/leaderboard.html"
Repository = "https://github.com/BanglaLLM/banglasafe"
Dataset = "https://huggingface.co/datasets/BanglaLLM/BanglaSafe"

[project.scripts]
banglasafe = "banglasafe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/banglasafe"]

[tool.ruff]
target-version = "py310"
line-length = 110
